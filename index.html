<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lottie Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js"></script>
    <style>
        body {
            background-color: #0b0e14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #ffffff;
            font-family: sans-serif;
        }
        #lottie-container {
            width: 600px;
            height: 600px;
            border: 2px dashed #30363d;
            border-radius: 10px;
            background-color: #161b22;
        }
        #controls {
            margin-top: 20px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>
    <h1>SpaceX Custom Like Animation</h1>
    <div id="lottie-container"></div>
    <div id="controls">
        <button onclick="playAnim()">Play</button>
    </div>
    <script>
        let anim;
        fetch('spcx.json')
            .then(res => res.json())
            .then(data => {
                anim = lottie.loadAnimation({
                    container: document.getElementById('lottie-container'),
                    renderer: 'svg',
                    loop: false,
                    autoplay: true,
                    animationData: data
                });
                
                anim.addEventListener('DOMLoaded', () => {
                    console.log('Lottie loaded successfully');
                    // 默认跳到第 15 帧（或播放到中间），便于看清火箭
                    // 也可以让它循环播放
                });
            })
            .catch(err => {
                console.error("Error loading JSON:", err);
                document.getElementById('lottie-container').innerText = "Load failed: " + err;
            });

        function playAnim() {
            if (anim) {
                anim.goToAndPlay(0, true);
            }
        }
    </script>
</body>
</html>
